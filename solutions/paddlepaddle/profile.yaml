llm:
  # Default Gemini model for image description in describe.py
  model: gemini-3-flash-preview

  # Base prompt used to describe cropped image regions.
  # The script will append the surrounding text context and a final
  # "Describe only this image region:" instruction when calling the LLM.
  describe_image_prompt: |
    You are describing a cropped region from a document or UI image. Below is the text content that has already been extracted from surrounding regions (in order). Describe completely what are inside in THIS image region in traditional Chinese. Do not repeat the surrounding text.
    Surrounding text so far:

layout:
  # Scaling factors applied on top of the base box_width_scale / box_height_scale
  # for text-like layout boxes in segment.py (labels such as text/paragraph/paragraph_title).
  # Defaults reproduce the previous hard-coded behavior:
  # - width +5% (×1.05)
  # - height +80% (×1.8)
  text_box_width_factor: 1.05
  text_box_height_factor: 1.8

