; Translation configuration for devops.sh's `translate` operation.
;
; Loaded by `./devops.sh translate [step]`. This is a single, repo-root
; config file (there is no per-language profile directory) — edit the
; values below directly to change the source/target language or output.
;
; File format: `key = value` per line, comments start with `;` or `#`,
; blank lines are ignored, and an optional leading `[section]` header is
; ignored (this file is flat key/value, no sections needed). Values don't
; need to be quoted, but a single layer of surrounding "..." or '...' quotes
; is stripped if present.
;
; Keys:
;   DIR          (required) Output directory (created at repo root) for the
;                translated sources and PDFs.
;   FROM         (required) Source language name passed to the LLM prompt.
;   TO           (required) Target language name passed to the LLM prompt.
;   MODEL        (optional) LLM model id. Defaults to devops.sh's LLM_MODEL.
;   FIGURE_LABEL (optional) pandoc-crossref "Figure" label override for the
;                target language. Leave unset to keep the English default.
;   TABLE_LABEL  (optional) pandoc-crossref "Tab." label override for the
;                target language. Leave unset to keep the English default.
;
; Steps (`./devops.sh translate <step>`):
;   all (default) - markdown translation -> cover translation -> paper PDF
;                   -> cover PDF -> printed PDF
;   markdown      - Translate paper.md only.
;   cover         - Translate cover_page.tex only.
;   pdf           - Build the paper PDF from the already-translated markdown.
;   cover_pdf     - Build the cover PDF from the already-translated LaTeX.
;   printed       - Merge the existing cover + paper PDFs.

DIR = zh_tw
FROM = English
TO = Traditional Chinese
MODEL = gemini-2.5-flash
FIGURE_LABEL = 圖
TABLE_LABEL = 表
